<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Carlos Emanuel López Villanueva, Luz Karina Araujo Aguilar, Jair Mardoqueo Sanchez Villa, Jovani Israel Perez Puente">
    <link type="image/png" sizes="16x16" rel="icon" href="../IMG/icono.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../JS/carrito.js"></script>
    <title>Carrito de Compras - Atlas de Mitologías</title>
</head>
<body onload="protegerPagina(); cargarCarrito();">

    <!-- Header principal -->
    <header class="header">
        <div class="header-contenido">
            <div class="logo-box">
                <span class="logo-spark">✦</span>
                <h3 class="nav-title">Atlas de Mitologías</h3>
            </div>
            
            <nav class="nav-menu">
                <ul class="nav-lista">
                    <li><a href="../index.html" class="nav-link">Inicio</a></li>
                    <li><a href="catalogo.html" class="nav-link">Catálogo</a></li>
                    <li><a href="carrito.html" class="nav-link" style="color: #BD8E43;">Carrito</a></li>
                </ul>
            </nav>

            <a href="catalogo.html" class="btn-regresar">
                <span>←</span> Volver al catálogo
            </a>
        </div>
    </header>

    <main>
        <section class="sec-recomendaciones">
            <div class="contenedor-form">
                <div class="header-form">
                    <span class="tagline-form">✦ TU SELECCIÓN CÓSMICA</span>
                    <h2 class="titulo-form">Carrito de Compras</h2>
                    <p class="desc-form">
                        Revisa los artículos acumulados en tu pedido antes de proceder al pago.
                    </p>
                </div>

                <div class="form-mitologia">
                   
                    <div id="lista_productos" class="campo-grupo"></div>

                    <div class="separator-container">
                        <hr class="linea-egipcia">
                        <span class="symbol-icon">✦</span>
                    </div>

    
                    <div class="campo-grupo">
                        <span class="total">TOTAL A PAGAR:</span>
                        <h1 class="total1">
                            $<span id="prod_precio">0</span> USD
                        </h1>
                    </div>

   
                    <div class="btn-container-form">
                        <button class="btn-enviar-form" onclick="volver()">
                            <span>←</span> Volver al Catálogo
                        </button>
                        <button class="btn-reset-form" onclick="vaciarCarrito()">
                            Vaciar Carrito
                        
                        
                        <button class="boton-compra" onclick="window.location.href='factura.html'">
                            Confirmar compra
                        </button>


                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
<script src="../JS/sesion.js"></script>
<script src="../JS/carrito.js"></script>
</body>
</html>
